<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>

  <main class="card">

    <img class="card__image" src="./assets/images/illustration-article.svg" alt="">

    <p class="card__category">Learning</p>
    <p class="card__date">Published 21 Dec 2023</p>

    <h1 class="card__heading">
      <a href="#">HTML &amp; CSS foundations</a>
    </h1>

    <p class="card__description">
      These languages are the backbone of every website, defining structure,
      content, and presentation.
    </p>

    <footer class="card__profile">
      <img class="card__avatar" src="./assets/images/image-avatar.webp" alt="">
      <p class="card__author">Greg Hooper</p>
    </footer>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>

</html>
